<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat with PDFs</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{--ink:#111;--mut:#6b7280;--line:#e5e5e5}
  *{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  body{background:#fff;color:var(--ink)}
  .side{border-right:1px solid var(--line)}
  .panel{border-left:1px solid var(--line)}
  .chatitem{border:1px solid transparent;border-radius:12px;padding:8px 10px;cursor:pointer;font-size:13px}
  .chatitem:hover{background:#f5f5f5}
  .chatitem.active{background:#111;color:#fff}
  .bubble{border-radius:16px;padding:10px 14px;max-width:85%;white-space:pre-wrap;font-size:14px;line-height:1.55}
  .u{background:#111;color:#fff;margin-left:auto}
  .a{background:#f5f5f5;border:1px solid var(--line)}
  .pill{display:flex;align-items:center;gap:8px;background:#111;color:#fff;border-radius:999px;
    padding:12px 28px;font-weight:600;box-shadow:0 10px 25px rgba(0,0,0,.25);cursor:pointer;border:none}
  .pill:hover{background:#000;transform:translateY(-1px)}
  .doc{border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12px}
  .tag{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--mut)}
  input,button{outline:none}
</style></head>
<body class="h-screen flex overflow-hidden">
<!-- LEFT: chats -->
<aside class="side w-64 shrink-0 p-4 flex flex-col gap-3 bg-white">
  <div class="font-bold text-lg tracking-tight">Chat with PDFs</div>
  <div class="text-xs text-neutral-500" id="health"></div>
  <button onclick="newChat()" class="pill justify-center" style="padding:10px 18px;font-size:14px">+ New chat</button>
  <div id="chats" class="flex flex-col gap-1 overflow-auto"></div>
  <div class="mt-auto text-[11px] text-neutral-400">Each chat keeps its own PDFs.<br>Nothing is shared across chats.</div>
</aside>
<!-- CENTER: conversation -->
<main class="flex-1 flex flex-col min-w-0">
  <div class="px-6 py-3 border-b flex items-center gap-3">
    <div id="title" class="font-semibold">Select or create a chat</div>
    <span id="count" class="tag"></span>
    <button id="delbtn" onclick="delCur()" title="Delete this chat + its PDFs"
      class="ml-auto text-xs border rounded-full px-3 py-1 text-neutral-500 hover:text-white hover:bg-black hover:border-black">Delete chat</button>
  </div>
  <div id="chat" class="flex-1 overflow-auto px-6 py-6 flex flex-col gap-3 bg-white"></div>
  <div class="p-4 border-t flex gap-2 bg-white">
    <input id="q" class="flex-1 border rounded-full px-5 py-3 text-sm" style="border-color:var(--line)"
      placeholder="Ask about this chat's PDFs…" onkeydown="if(event.key==='Enter')ask()">
    <button onclick="ask()" class="pill" style="padding:12px 26px">Send</button>
  </div>
</main>
<!-- RIGHT: upload (minimal, like reference) -->
<aside class="panel w-80 shrink-0 p-6 hidden md:flex flex-col items-center gap-4 bg-white">
  <div class="font-semibold self-start">Documents in this chat</div>
  <label class="pill mt-2"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    Upload<input id="pdf" type="file" accept=".pdf" multiple class="hidden" onchange="upload()"></label>
  <div class="text-xs text-neutral-500 -mt-2" id="ustatus">PDF only · threaded ingest</div>
  <div id="docs" class="w-full flex flex-col gap-2 overflow-auto"></div>
  <div class="mt-auto w-full text-[11px] text-neutral-400 border rounded-xl p-3">Tables are kept whole.<br>Text 800/120 · Code 600/80 · Images cited by page.</div>
</aside>
<script>
let cur=null;
async function health(){const j=await (await fetch('/api/health')).json();
document.getElementById('health').innerText=`${j.model} · ${j.mongo?'Mongo':'local'}`;}
async function loadChats(){const j=await (await fetch('/api/chats')).json();
const box=document.getElementById('chats');box.innerHTML='';
j.chats.forEach(c=>{const d=document.createElement('div');d.className='chatitem'+(c.id===cur?' active':'');
d.style.display='flex';d.style.justifyContent='space-between';d.style.alignItems='center';
const s=document.createElement('span');s.innerText=`${c.title} · ${c.doc_ids.length}`;s.style.flex='1';s.onclick=()=>select(c.id);
const x=document.createElement('button');x.innerText='×';x.title='Delete chat + its PDFs';
x.style.cssText='margin-left:8px;border-radius:999px;width:22px;height:22px;line-height:1;'+(c.id===cur?'color:#fff':'color:#999');
x.onclick=(e)=>{e.stopPropagation();delChat(c.id,c.title);};
d.appendChild(s);d.appendChild(x);box.appendChild(d);});
if(!cur&&j.chats.length)select(j.chats[0].id);}
async function delChat(id,title){if(!confirm(`Delete "${title}" + its PDFs?`))return;
const r=await fetch(`/api/chats/${id}`,{method:'DELETE'});const j=await r.json();
if(j.error)return alert(j.error);
if(cur===id){cur=null;document.getElementById('chat').innerHTML='';document.getElementById('docs').innerHTML='';
document.getElementById('title').innerText='Select or create a chat';document.getElementById('count').innerText='';}
loadChats();}
async function delCur(){if(!cur)return;const t=document.getElementById('title').innerText;delChat(cur,t);}
async function newChat(){const r=await fetch('/api/chats',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:''})});
const j=await r.json();cur=j.chat.id;await loadChats();await select(cur);}
async function select(id){cur=id;await loadChats();
const j=await (await fetch(`/api/chats/${id}`)).json();
document.getElementById('title').innerText=j.chat.title;
document.getElementById('count').innerText=`${j.documents.length} PDFs`;
document.getElementById('docs').innerHTML=j.documents.map(d=>
`<div class="doc"><b>${d.name}</b><br><span class="text-neutral-500">${d.pages}p · ${d.chunks} chunks · ${JSON.stringify(d.breakdown||{})}</span></div>`).join('')||'<div class="text-xs text-neutral-400">No PDFs yet — Upload on the right.</div>';
const box=document.getElementById('chat');box.innerHTML='';
j.messages.forEach(m=>add(m.role==='user'?'user':'assistant',m.content+mcite(m.citations)));box.scrollTop=box.scrollHeight;}
function mc(c){return '';}
function mcite(c){return '';}
function clean(t){return String(t||'').replace(/【[^】]*】/g,'').replace(/\s*\[doc:[^\]]*\]/gi,'').replace(/\n?\s*—\s*(\[[^\]]*\]\s*)+$/,'').replace(/\n{3,}/g,'\n\n').trim();}
function add(role,text){const d=document.createElement('div');d.className='bubble '+(role==='user'?'u':'a');
d.innerText=clean(text);document.getElementById('chat').appendChild(d);
document.getElementById('chat').scrollTop=1e9;return d;}
async function upload(){if(!cur)return alert('Create a chat first');
const fs=document.getElementById('pdf').files;if(!fs.length)return;
document.getElementById('ustatus').innerText='Indexing… (threaded)';
const fd=new FormData();fd.append('file',fs[0]);
const r=await fetch(`/api/chats/${cur}/upload`,{method:'POST',body:fd});const j=await r.json();
document.getElementById('ustatus').innerText=r.error?('Error: '+r.error):`Done in ${j.total_ms}ms · ${JSON.stringify(j.document.breakdown)}`;
document.getElementById('pdf').value='';select(cur);}
async function ask(){const q=document.getElementById('q').value.trim();if(!q||!cur)return alert('Pick a chat first');
add('user',q);document.getElementById('q').value='';const b=add('assistant','…');
const es=new EventSource(`/api/chats/${cur}/stream?q=${encodeURIComponent(q)}`);
let full='',got=false;
es.onmessage=e=>{if(e.data==='[DONE]'){es.close();if(got)select(cur);return;}
try{const j=JSON.parse(e.data);if(j.token){got=true;full+=j.token;b.innerText=full;}
if(j.citations){full+=mc(j.citations);b.innerText=full;}}catch(_){}};
es.onerror=()=>{es.close();if(!got)b.innerText='[request failed — is runserver still running? check /api/health]';};}
health();loadChats();
</script></body></html>
